# ============================================================
# render.yaml — Render Blueprint for the portfolio backend
# In Render: New + > Blueprint, point it at this repo. Set the
# secret env vars (marked sync:false) in the dashboard afterward.
# If your repo root is the project (not /backend), set rootDir below.
# ============================================================
services:
  - type: web
    name: manzar-portfolio-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
